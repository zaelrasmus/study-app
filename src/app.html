<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    <!-- The theme, applied before the first paint.

         Everything else renders after the bundle boots, which is fine because
         there is nothing on screen yet. The background is not: without this,
         opening the app in dark mode flashes a white window while the runtime
         catches up. Reads the same key mode-watcher owns. -->
    <script>
      try {
        var pref = localStorage.getItem("mode-watcher-mode") || "system";
        var dark =
          pref === "dark" ||
          (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        /* the light default is fine */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
